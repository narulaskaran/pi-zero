<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Space Needle — engraved vector adaptation</title>
  <desc id="desc">A black-line architectural adaptation of the Space Needle, preserving its spire, saucer observation deck, divided window band, tripod supports and sparse connecting platforms. Restrained directional hatching shades the structure; the sky remains white.</desc>
  <rect width="400" height="640" fill="#fff"/>
  <defs>
    <clipPath id="left-support-hatch"><path d="M145 225 Q151 271 168 320 Q181 361 190 414 L164 503 Q155 533 132 578 L106 580 Q130 527 138 492 Q153 429 153 380 Q153 314 145 225Z M119 225 Q135 287 132 348 Q130 413 119 469 Q111 519 80 579 L104 585 Q139 530 151 477 Q166 411 158 351 Q151 286 145 225Z"/></clipPath>
    <clipPath id="right-support-hatch"><path d="M255 225 Q249 271 232 320 Q219 361 210 414 L236 503 Q245 533 268 578 L294 580 Q270 527 262 492 Q247 429 247 380 Q247 314 255 225Z M281 225 Q265 287 268 348 Q270 413 281 469 Q289 519 320 579 L296 585 Q261 530 249 477 Q234 411 242 351 Q249 286 255 225Z"/></clipPath>
    <clipPath id="both-supports-hatch"><path d="M145 225 Q151 271 168 320 Q181 361 190 414 L164 503 Q155 533 132 578 L106 580 Q130 527 138 492 Q153 429 153 380 Q153 314 145 225Z M119 225 Q135 287 132 348 Q130 413 119 469 Q111 519 80 579 L104 585 Q139 530 151 477 Q166 411 158 351 Q151 286 145 225Z M255 225 Q249 271 232 320 Q219 361 210 414 L236 503 Q245 533 268 578 L294 580 Q270 527 262 492 Q247 429 247 380 Q247 314 255 225Z M281 225 Q265 287 268 348 Q270 413 281 469 Q289 519 320 579 L296 585 Q261 530 249 477 Q234 411 242 351 Q249 286 255 225Z"/></clipPath>
  </defs>
