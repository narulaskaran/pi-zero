    <g stroke-width=".95"><path d="M124 315l7 6 M123 331l8 6 M122 348l8 6 M121 365l8 6 M119 383l9 6 M117 401l9 6 M114 420l9 6 M111 439l9 6 M107 458l9 6 M102 478l9 6 M97 498l9 6 M91 518l9 6 M84 539l9 6 M78 559l8 5"/><path d="M276 315l-7 6 M277 331l-8 6 M278 348l-8 6 M279 365l-8 6 M281 383l-9 6 M283 401l-9 6 M286 420l-9 6 M289 439l-9 6 M293 458l-9 6 M298 478l-9 6 M303 498l-9 6 M309 518l-9 6 M316 539l-9 6 M322 559l-8 5"/></g>
