    <path d="M81 157 Q89 137 121 128 Q157 119 200 119 Q243 119 279 128 Q311 137 319 157 Q312 165 291 168 Q250 173 200 173 Q150 173 109 168 Q88 165 81 157Z" fill="#fff" stroke-width="3.3"/>
    <path d="M94 155 Q118 132 200 130 Q282 132 306 155" stroke-width="1.05"/>
    <path d="M103 158 Q142 166 200 166 Q258 166 297 158" stroke-width="1.05"/>
    <!-- roof edge engraving: short, sparse radial marks -->
    <g stroke-width="1">
      <path d="M113 143l-5 9 M126 139l-4 11 M141 136l-3 11 M157 133l-2 12 M174 132l-1 12 M190 131v12 M210 131v12 M227 132l1 12 M244 133l2 12 M260 136l3 11 M276 139l4 11 M289 143l5 9"/>
