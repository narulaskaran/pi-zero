    </g>
    <!-- continuous glazed observation-room band; fine vertical bays retain the real lantern-like ring -->
    <path d="M87 168 Q119 176 200 177 Q281 176 313 168 L308 198 Q277 208 200 209 Q123 208 92 198 Z" fill="#fff" stroke-width="3.3"/>
    <path d="M91 181 Q137 190 200 190 Q263 190 309 181" stroke-width="1"/>
    <path d="M93 197 Q136 205 200 205 Q264 205 307 197" stroke-width="1"/>
