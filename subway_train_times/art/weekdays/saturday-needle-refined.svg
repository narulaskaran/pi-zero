      <path d="M152 238l8 10 M153 252l8 10 M155 267l8 10 M157 282l8 10 M159 298l8 10 M161 314l8 10 M164 330l8 10 M166 347l8 10 M168 364l8 10 M169 382l8 10 M169 401l8 10 M168 420l8 10 M165 440l8 10 M161 460l8 10 M156 480l8 10 M150 500l8 10 M143 520l8 10 M135 540l8 10 M126 559l8 10"/>
      <path d="M248 238l-8 10 M247 252l-8 10 M245 267l-8 10 M243 282l-8 10 M241 298l-8 10 M239 314l-8 10 M236 330l-8 10 M234 347l-8 10 M232 364l-8 10 M231 382l-8 10 M231 401l-8 10 M232 420l-8 10 M235 440l-8 10 M239 460l-8 10 M244 480l-8 10 M250 500l-8 10 M257 520l-8 10 M265 540l-8 10 M274 559l-8 10"/>
    </g>
    <!-- slim shadow edge on the service core; sparse diagonal cuts -->
    <g stroke-width=".95"><path d="M205 247l5-5 M205 260l5-5 M205 273l5-5 M205 286l5-5 M205 299l5-5 M205 312l5-5 M205 325l5-5 M205 338l5-5 M205 351l5-5 M205 364l5-5 M205 377l5-5 M205 390l5-5 M205 403l5-5 M205 416l5-5 M205 429l5-5 M205 442l5-5 M205 455l5-5 M205 468l5-5"/></g>
