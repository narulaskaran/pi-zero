<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Space Needle — authored monochrome architectural study</title>
  <desc id="desc">An original black and white interpretation of Seattle's Space Needle, with a broad saucer roof, glazed observation band, dark projecting soffit, central shaft and three swept legs. Structural shadows are grouped into solid planes with open highlights.</desc>
  <rect width="400" height="640" fill="white"/>
  <g stroke="#111" stroke-linejoin="round" stroke-linecap="round">
    <!-- tapering antenna and crown -->
    <path d="M200 38v78" fill="none" stroke-width="2.6"/>
    <path d="M196 113q4-7 8 0l3 10-7 4-7-4z" fill="white" stroke-width="1.8"/>

    <!-- shallow gold roof: one strong eave, a light crown and a few curved ribs -->
    <path d="M83 165q5-22 38-33 31-10 79-10t79 10q33 11 38 33-7 8-34 12-37 6-83 6t-83-6q-27-4-34-12z" fill="white" stroke-width="3.2"/>
    <path d="M95 160q23-19 105-21 82 2 105 21" fill="none" stroke-width="1.3"/>
    <path d="M99 163q32 10 101 10 69 0 101-10" fill="none" stroke-width="1.1"/>
    <path d="M108 151q3 6 3 11m20-16q2 7 2 14m23-17v18m25-19v19m19-19v19m25-18v18m24-17q-1 8-2 15m22-12q-2 7-4 12" fill="none" stroke-width="1"/>

    <!-- continuous glazing band; wide panels group at small size -->
    <path d="M87 177q40 13 113 13t113-13l-5 31q-35 13-108 13T92 208z" fill="white" stroke-width="3"/>
    <path d="M91 190q35 12 109 12t109-12M94 205q37 11 106 11t106-11" fill="none" stroke-width="1.3"/>
    <path d="M116 183l3 30m27-25 1 29m28-27v28m29-28v28m29-28-1 28m28-30-3 29m27-34-4 30" fill="none" stroke-width="1.4"/>
    <!-- select panes are darkened, with white glints to keep the glass legible -->
    <path d="M99 185q6 3 12 4l2 24q-8-2-13-4zm176 4q13-2 23-7l-2 24q-8 4-24 6z" fill="#111" stroke="none"/>
    <path d="M101 188l6 3m174 0 13-4" fill="none" stroke="white" stroke-width="1.4"/>

    <!-- projecting deck lip and dark underside, interrupted by clean light cuts -->
    <path d="M92 211q37 12 108 12t108-12l13 15q-42 17-121 17T79 226z" fill="#111" stroke-width="2.2"/>
    <path d="M91 222q40 13 109 13t109-13" fill="none" stroke="white" stroke-width="2.3"/>
    <path d="M112 227l-5 8m23-2-3 9m25-5-1 10m28-9v9m24-9 1 9m26-12 3 9m21-14 5 8m16-14 7 7" fill="none" stroke="white" stroke-width="1.2"/>
    <!-- structural belly: central boss and only a few radial ribs -->
    <path d="M145 240q55 13 110 0l-10 15q-45 10-90 0z" fill="#111" stroke-width="1.7"/>
    <path d="M159 244l-5 10m22-8-2 11m22-9v10m20-10 2 9m20-12 5 8" fill="none" stroke="white" stroke-width="1.2"/>
    <path d="M194 254l-9 18 15 9 15-9-9-18z" fill="white" stroke-width="1.8"/>

    <!-- rear central swept leg is set behind the two broad foreground legs -->
    <path d="M194 268q-4 77 1 127l5 22 8-22q4-51-2-127z" fill="#111" stroke-width="1.5"/>
    <path d="M199 282q-2 49 1 90" fill="none" stroke="white" stroke-width="2"/>

    <!-- central shaft: tapered white core with dark right face and elevator slit -->
    <path d="M177 263q23 4 46 0l-7 147q-16 12-32 0z" fill="white" stroke-width="2.7"/>
    <path d="M211 266l12-3-7 147-9 5z" fill="#111" stroke="none"/>
    <path d="M195 276v128m7-125-2 118" fill="none" stroke-width="1.4"/>
    <path d="M198 292v45" fill="none" stroke="white" stroke-width="2.2"/>

    <!-- foreground tripod legs: broad sculptural members, without an all-over cage -->
    <path d="M162 260q15 66 22 130 5 38-10 81-18 49-47 101l-27-2q32-69 40-111 12-63 2-121-7-43-20-77z" fill="white" stroke-width="3.5"/>
    <path d="M238 260q-15 66-22 130-5 38 10 81 18 49 47 101l27-2q-32-69-40-111-12-63-2-121 7-43 20-77z" fill="white" stroke-width="3.5"/>
    <!-- one continuous shaded face on each curved leg; white highlight stays broad -->
    <path d="M157 270q19 62 25 128 5 49-18 112-11 31-31 65l-12-3q30-59 39-111 11-64 0-121-5-38-14-66z" fill="#111" stroke="none"/>
    <path d="M243 270q-19 62-25 128-5 49 18 112 11 31 31 65l12-3q-30-59-39-111-11-64 0-121 5-38 14-66z" fill="#111" stroke="none"/>
    <path d="M140 319q12 51 7 101-4 42-23 83m136-184q-12 51-7 101 4 42 23 83" fill="none" stroke="white" stroke-width="2.6"/>

    <!-- two narrow tie beams: actual cross-connection, not invented lattice -->
    <path d="M132 369q68 18 136 0m-151 82q83 22 166 0" fill="none" stroke-width="4.2"/>
    <path d="M132 368q68 18 136 0m-151 82q83 22 166 0" fill="none" stroke="white" stroke-width="1.2"/>

    <!-- light, intentional edge cuts articulate steel faces -->
    <path d="M177 399q-5 30-17 55m63-55q5 30 17 55M167 470q-13 42-34 75m100-75q13 42 34 75" fill="none" stroke-width="1.35"/>
    <path d="M96 574q16-3 31 2l-5 8q-16-5-31-2zm176 2q15-5 31-2l5 8q-16-3-31 2z" fill="#111" stroke-width="1.6"/>
  </g>
</svg>
